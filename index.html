<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurriculumOS</title>
    <meta name="description" content="CurriculumOS — Master development through structured roadmaps and hands-on modules." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
      // Prevent white flash on dark mode — runs synchronously before paint
      (function() {
        try {
          var t = localStorage.getItem('curriculum-os-theme');
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else document.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
