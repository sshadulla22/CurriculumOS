<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Search Engine Meta Tags -->
    <title>CurriculumOS — Master Web Development, Software Engineering & Tech Roadmaps</title>
    <meta name="title" content="CurriculumOS — Master Web Development, Software Engineering & Tech Roadmaps" />
    <meta name="description" content="CurriculumOS (Curriculum OS) is an interactive developer roadmap platform. Master JavaScript, Full-Stack engineering, system design, and algorithms with hands-on modules and structured learning paths." />
    <meta name="keywords" content="CurriculumOS, Curriculum OS, developer roadmap, software engineering curriculum, coding roadmaps, tech learning paths, web development, javascript tutorial, full stack curriculum, computer science course" />
    <meta name="author" content="CurriculumOS" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://curriculumos.com/" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CurriculumOS" />
    <meta property="og:url" content="https://curriculumos.com/" />
    <meta property="og:title" content="CurriculumOS — Interactive Developer Roadmaps & Software Engineering Curriculum" />
    <meta property="og:description" content="Master software engineering with CurriculumOS. Interactive roadmaps, code snippets, interview prep, and structured learning paths." />
    <meta property="og:image" content="https://curriculumos.com/og-image.svg" />
    <meta property="og:image:alt" content="CurriculumOS — Interactive Developer Roadmaps & Learning Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://curriculumos.com/" />
    <meta name="twitter:title" content="CurriculumOS — Developer Roadmaps & Software Engineering" />
    <meta name="twitter:description" content="Master web development and software engineering through structured CurriculumOS roadmaps." />
    <meta name="twitter:image" content="https://curriculumos.com/og-image.svg" />

    <!-- Web App & Theme Info -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CurriculumOS" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/og-image.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Schema.org JSON-LD Structured Data for Google Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://curriculumos.com/#website",
          "url": "https://curriculumos.com/",
          "name": "CurriculumOS",
          "alternateName": ["Curriculum OS", "CurriculumOS Platform"],
          "description": "Master software engineering through structured roadmaps and hands-on modules on CurriculumOS.",
          "inLanguage": "en-US"
        },
        {
          "@type": "EducationalOrganization",
          "@id": "https://curriculumos.com/#organization",
          "name": "CurriculumOS",
          "alternateName": "Curriculum OS",
          "url": "https://curriculumos.com/",
          "logo": "https://curriculumos.com/og-image.svg",
          "description": "Interactive software engineering curriculum and developer roadmap platform."
        },
        {
          "@type": "Course",
          "@id": "https://curriculumos.com/#course-javascript",
          "name": "JavaScript & Full-Stack Development Curriculum",
          "description": "Master JavaScript fundamentals, async programming, React, DOM manipulation, and advanced software architecture on CurriculumOS.",
          "provider": {
            "@type": "Organization",
            "name": "CurriculumOS",
            "sameAs": "https://curriculumos.com/"
          }
        }
      ]
    }
    </script>

    <script>
      // Prevent white flash on dark mode — runs synchronously before paint
      (function() {
        try {
          var t = localStorage.getItem('curriculum-os-theme');
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          else document.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
