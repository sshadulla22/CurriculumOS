ault to const. Use let only when you reassign. Avoid var in new code — function scope and hoisting make bugs easy."}],subTopics:[{id:"var-let-const",title:"var, let, const",description:"var is function-scoped and hoisted as undefined. let and const are block-scoped and live in the Temporal Dead Zone until their line runs. const cannot be reassigned (the binding is fixed; object contents can still change).",table:{headers:["","var","let","const"],rows:[["Scope","Function","Block","Block"],["Hoisted","Yes (undefined)","TDZ","TDZ"],["Reassign","Yes","Yes","No"],["Redeclare","Yes","No","No"]]},code:`const user = { name: "Ada" };
